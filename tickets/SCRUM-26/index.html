<!DOCTYPE html>
<html>
<head>
  <title>SCRUM-25</title>
  <style>
    body {
      font-family: Arial, sans-serif;
    }
    .container {
      width: 80%;
      margin: 40px auto;
      text-align: center;
    }
    button {
      padding: 10px 20px;
      border: none;
      border-radius: 5px;
      background-color: #4CAF50;
      color: #fff;
      cursor: pointer;
    }
    button:hover {
      background-color: #3e8e41;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>SCRUM-25</h1>
    <p>Description de la tâche</p>
    <button id="btn">Cliquez-moi</button>
    <p id="resultat"></p>
  </div>
  <script>
    document.getElementById("btn").addEventListener("click", function() {
      document.getElementById("resultat").innerHTML = "Vous avez cliqué sur le bouton";
    });
  </script>
</html>
